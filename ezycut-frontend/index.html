<!doctype html>
<html lang="en">
  <head>
    <script>window.__loaderStart = Date.now();</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ezycut-navbar-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZYCUT — Smart Salon Booking & Queue Management</title>
    <meta name="description" content="Book salon appointments online, track your queue in real time, and manage your grooming experience with EzyCut — India's smart salon platform." />
    <meta name="keywords" content="salon booking, haircut appointment, queue tracking, barbershop, beauty salon India" />
    <meta property="og:title" content="EzyCut — Smart Salon Booking" />
    <meta property="og:description" content="Book salon appointments, skip queues, and track your experience in real time." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
  #app-loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    background: radial-gradient(circle at 50% 42%, #f0fdfa 0%, #ffffff 68%);
    transition: opacity 0.45s ease, visibility 0.45s ease;
  }

  #app-loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 1;
    transition: opacity 0.5s ease;
    padding: 0 1.5rem;
  }

  .loader-content.fade-out {
    opacity: 0;
  }

  /* ---- logo mark ---- */
  .loader-mark {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 104px;
  }

  .loader-mark::before {
    content: "";
    position: absolute;
    inset: -24px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(13, 122, 111, 0.12) 0%, transparent 72%);
    animation: ezLoaderGlow 3.2s ease infinite;
  }

  .loader-logo-img {
    position: relative;
    width: 100px;
    height: 100px;
    object-fit: contain;
    opacity: 0;
    transform: translateY(14px) scale(0.82);
    filter: drop-shadow(0 8px 18px rgba(13, 122, 111, 0.2));
    transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .loader-mark.show .loader-logo-img {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* ---- brand name, letter by letter ---- */
  .brand-name-type {
    position: relative;
    display: flex;
    align-items: center;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .brand-name-type .ltr {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .brand-name-type .ink { color: #17181a; }
  .brand-name-type .teal { color: #0d7a6f; }

  .brand-name-type .ltr.show {
    opacity: 1;
    transform: translateY(0);
  }

  .brand-name-type .ltr:nth-child(1).show { transition-delay: 0ms; }
  .brand-name-type .ltr:nth-child(2).show { transition-delay: 80ms; }
  .brand-name-type .ltr:nth-child(3).show { transition-delay: 160ms; }
  .brand-name-type .ltr:nth-child(4).show { transition-delay: 240ms; }
  .brand-name-type .ltr:nth-child(5).show { transition-delay: 320ms; }
  .brand-name-type .ltr:nth-child(6).show { transition-delay: 400ms; }

  /* ---- scissor accent, sits below the Y/C junction ---- */
  .logo-scissor-accent {
    position: absolute;
    left: 50%;
    bottom: -22px;
    transform: translateX(-50%) scale(0.5) translateY(-6px);
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .logo-scissor-accent.show {
    opacity: 1;
    transform: translateX(-50%) scale(1) translateY(0);
  }

  .mini-scissor { width: 22px; height: 28px; overflow: visible; }
  .mblade-left, .mblade-right { transform-origin: 11px 9px; }

  .logo-scissor-accent.show.snip .mblade-left {
    animation: miniSnipLeft 0.55s ease-in-out 2;
  }
  .logo-scissor-accent.show.snip .mblade-right {
    animation: miniSnipRight 0.55s ease-in-out 2;
  }

  @keyframes miniSnipLeft {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-13deg); }
  }
  @keyframes miniSnipRight {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(13deg); }
  }

  /* ---- slogan ---- */
  .brand-slogan {
    margin-top: -10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #6b7268;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    text-align: center;
  }

  .brand-slogan.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---- status text ---- */
  .loader-status {
    margin-top: 2px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: #8b928d;
    opacity: 0;
    animation: ezLoaderStatusFade 1.8s ease infinite;
  }

  @keyframes ezLoaderStatusFade {
    0%   { opacity: 0; transform: translateY(4px); }
    15%  { opacity: 1; transform: translateY(0); }
    85%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-4px); }
  }

  /* ---- progress bar ---- */
  .loader-bar-track {
    width: 200px;
    height: 3px;
    border-radius: 999px;
    background: #e6ebe9;
    overflow: hidden;
  }

  .loader-bar-fill {
    height: 100%;
    width: 38%;
    border-radius: 999px;
    background: linear-gradient(90deg, #0d7a6f, #3d9990);
    box-shadow: 0 0 8px rgba(13, 122, 111, 0.35);
    animation: loaderSlide 1.15s ease-in-out infinite;
  }

  @keyframes ezLoaderGlow {
    0%   { opacity: 0.4; transform: scale(0.92); }
    50%  { opacity: 1; transform: scale(1.06); }
    100% { opacity: 0.4; transform: scale(0.92); }
  }

  @keyframes loaderSlide {
    0% { transform: translateX(-120%); }
    50% { transform: translateX(140%); }
    100% { transform: translateX(-120%); }
  }

  /* ---- responsive ---- */
  @media (max-width: 480px) {
    .loader-logo-img { width: 84px; height: 84px; }
    .loader-ring { width: 118px; height: 118px; }
    .brand-name-type { font-size: 29px; }
    .brand-slogan { font-size: 10px; letter-spacing: 0.16em; }
    .loader-bar-track { width: 170px; }
  }
</style>
  </head>
 <body>
 
 <div id="app-loader">
  <div class="loader-content">
    <div class="loader-mark">
      <img class="loader-logo-img" src="/ezycut-navbar-icon.png" alt="EzyCut" />
    </div>

    <div class="brand-name-type">
      <span class="ltr ink" id="ltr-E">E</span>
      <span class="ltr ink" id="ltr-Z">Z</span>
      <span class="ltr ink" id="ltr-Y">Y</span>
      <span class="ltr teal" id="ltr-C">C</span>
      <span class="ltr teal" id="ltr-U">U</span>
      <span class="ltr teal" id="ltr-T">T</span>

      <span class="logo-scissor-accent" id="scissor-accent">
        <svg class="mini-scissor" viewBox="0 0 22 46" xmlns="http://www.w3.org/2000/svg">
          <g class="mblade-left">
            <path d="M11 9 L2 25 L5.5 26.5 L13.5 11 Z" fill="#0d7a6f" />
            <circle cx="4.5" cy="27" r="3.2" fill="none" stroke="#0d7a6f" stroke-width="1.5" />
          </g>
          <g class="mblade-right">
            <path d="M11 9 L20 25 L16.5 26.5 L8.5 11 Z" fill="#17181a" />
            <circle cx="17.5" cy="27" r="3.2" fill="none" stroke="#17181a" stroke-width="1.5" />
          </g>
        </svg>
      </span>
    </div>

    <div class="brand-slogan">Smart Grooming. Better Prices.</div>

    <div class="loader-bar-track">
      <div class="loader-bar-fill"></div>
    </div>

    <div id="loader-status" class="loader-status">Setting things up...</div>
  </div>
</div>

  <div id="root"></div>
 <script>
  (function () {
    const loader = document.getElementById("app-loader");
    const content = loader.querySelector(".loader-content");
    const mark = loader.querySelector(".loader-mark");
    const sloganEl = loader.querySelector(".brand-slogan");

    const $ = (id) => document.getElementById(id);
    const E = $("ltr-E"), Z = $("ltr-Z"), Y = $("ltr-Y"), C = $("ltr-C"), U = $("ltr-U"), T = $("ltr-T");
    const scissorAccent = $("scissor-accent");

    const STAGE = {
      logo: 250,
      E: 1000,
      Z: 1150,
      Y: 1300,
      C: 1450,
      U: 1600,
      T: 1750,
      scissorIn: 2100,
      scissorSnip: 2200,
      slogan: 3100,
      fadeOut: 4200,
      loopEnd: 5000,
    };

    function resetStages() {
      content.classList.remove("fade-out");
      mark.classList.remove("show");
      sloganEl.classList.remove("show");
      [E, Z, Y, C, U, T].forEach((el) => el.classList.remove("show"));
      scissorAccent.classList.remove("show", "snip");
    }

    function runSequence() {
      resetStages();
      setTimeout(() => mark.classList.add("show"), STAGE.logo);
      setTimeout(() => E.classList.add("show"), STAGE.E);
      setTimeout(() => Z.classList.add("show"), STAGE.Z);
      setTimeout(() => Y.classList.add("show"), STAGE.Y);
      setTimeout(() => C.classList.add("show"), STAGE.C);
      setTimeout(() => U.classList.add("show"), STAGE.U);
      setTimeout(() => T.classList.add("show"), STAGE.T);
      setTimeout(() => scissorAccent.classList.add("show"), STAGE.scissorIn);
      setTimeout(() => scissorAccent.classList.add("snip"), STAGE.scissorSnip);
      setTimeout(() => sloganEl.classList.add("show"), STAGE.slogan);
      setTimeout(() => content.classList.add("fade-out"), STAGE.fadeOut);
    }

    runSequence();
    setInterval(runSequence, STAGE.loopEnd);

    const messages = [
      "Setting things up...",
      "Finding your perfect salon...",
      "Almost there...",
      "Polishing the details...",
    ];
    let i = 0;
    const statusEl = document.getElementById("loader-status");
    if (statusEl) {
      setInterval(() => {
        i = (i + 1) % messages.length;
        statusEl.textContent = messages[i];
      }, 1800);
    }
  })();
</script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
