<!doctype html>
<html lang="en">
  <head>
    <script>window.__loaderStart = Date.now();</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ezycut-navbar-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZYCUT — Smart Salon Booking & Queue Management</title>
    <meta name="description" content="Book salon appointments online, track your queue in real time, and manage your grooming experience with EzyCut — India's smart salon platform." />
    <meta name="keywords" content="salon booking, haircut appointment, queue tracking, barbershop, beauty salon India" />
    <meta property="og:title" content="EzyCut — Smart Salon Booking" />
    <meta property="og:description" content="Book salon appointments, skip queues, and track your experience in real time." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
  #app-loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    background: radial-gradient(circle at 50% 40%, #f0fdfa 0%, #ffffff 65%);
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }

  #app-loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #app-loader .loader-mark {
    position: relative;
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---- soft glow behind the whole mark ---- */
  #app-loader .loader-mark::before {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 96, 90, 0.10) 0%, transparent 70%);
    animation: ezLoaderGlow 3.6s ease infinite;
  }

  /* ---- ring arc that draws itself, sits behind the logo ---- */
  #app-loader .loader-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #00605a;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 251;
    stroke-dashoffset: 251;
    filter: drop-shadow(0 2px 6px rgba(0, 96, 90, 0.25));
    animation: ezLoaderRing 3.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }

  /* ---- actual logo image, fades/scales up in the middle of the ring ---- */
  #app-loader .loader-logo-img {
    position: relative;
    width: 108px;
    height: 108px;
    object-fit: contain;
    opacity: 0;
    transform: translateY(10px) scale(0.85);
    filter: drop-shadow(0 6px 16px rgba(0, 96, 90, 0.18));
    animation: ezLoaderFace 3.6s ease infinite;
  }

  #app-loader .brand-name {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: #17181a;
    opacity: 0;
    transform: translateY(8px);
    animation: ezLoaderText 3.6s ease infinite;
  }

  #app-loader .brand-name span {
    color: #00605a;
  }

  #app-loader .brand-slogan {
    margin-top: -18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #5a5f5c;
    opacity: 0;
    transform: translateY(6px);
    animation: ezLoaderText 3.6s ease infinite;
    animation-delay: 0.15s;
  }

  #app-loader .loader-status {
    margin-top: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: #6b7280;
    opacity: 0;
    animation: ezLoaderStatusFade 1.8s ease infinite;
  }

  @keyframes ezLoaderStatusFade {
    0%   { opacity: 0; transform: translateY(4px); }
    15%  { opacity: 1; transform: translateY(0); }
    85%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-4px); }
  }

  #app-loader .loader-bar-track {
    margin-top: 10px;
    width: 220px;
    height: 4px;
    border-radius: 999px;
    background: #e2e8e6;
    overflow: hidden;
  }

  #app-loader .loader-bar-fill {
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, #00605a, #3d9990);
    box-shadow: 0 0 8px rgba(0, 96, 90, 0.35);
    animation: loaderSlide 1.1s ease-in-out infinite;
  }

  /* subtle pulsing glow behind the mark */
  @keyframes ezLoaderGlow {
    0%   { opacity: 0.4; transform: scale(0.92); }
    50%  { opacity: 1; transform: scale(1.06); }
    100% { opacity: 0.4; transform: scale(0.92); }
  }

  /* face fade-up-and-hold, synced to one shared 3.6s loop so it stays
     in sync every repeat (percentages baked in, not animation-delay) */
  @keyframes ezLoaderFace {
    0%   { opacity: 0; transform: translateY(10px) scale(0.85); }
    12%  { opacity: 1; transform: translateY(0) scale(1); }
    78%  { opacity: 1; transform: translateY(0) scale(1); }
    90%  { opacity: 0; transform: translateY(-4px) scale(0.96); }
    100% { opacity: 0; transform: translateY(10px) scale(0.85); }
  }

  /* ring draws in after the faces appear, holds, then fades with them */
  @keyframes ezLoaderRing {
    0%   { opacity: 0; stroke-dashoffset: 251; }
    18%  { opacity: 1; }
    46%  { stroke-dashoffset: 40; }
    78%  { opacity: 1; stroke-dashoffset: 40; }
    90%  { opacity: 0; stroke-dashoffset: 40; }
    100% { opacity: 0; stroke-dashoffset: 251; }
  }

  /* text/slogan fade up last, hold, fade out just before loop resets */
  @keyframes ezLoaderText {
    0%   { opacity: 0; transform: translateY(8px); }
    40%  { opacity: 0; transform: translateY(8px); }
    52%  { opacity: 1; transform: translateY(0); }
    78%  { opacity: 1; transform: translateY(0); }
    90%  { opacity: 0; transform: translateY(-4px); }
    100% { opacity: 0; transform: translateY(8px); }
  }

  @keyframes loaderSlide {
    0% { transform: translateX(-100%); }
    50% { transform: translateX(120%); }
    100% { transform: translateX(-100%); }
  }
</style>
  </head>
  <body>
   <!-- ── Initial Splash Loader ── -->
<div id="app-loader">
  <div class="loader-mark">
    <svg class="loader-ring" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="60" r="40" />
    </svg>
    <img class="loader-logo-img" src="/ezycut-navbar-icon.png" alt="EzyCut" />
  </div>

  <div class="brand-name">EZY<span>CUT</span></div>
  <div class="brand-slogan">Smart Grooming. Better Prices.</div>

  <div class="loader-bar-track">
    <div class="loader-bar-fill"></div>
  </div>

  <div id="loader-status" class="loader-status">Setting things up...</div>
</div>

    <div id="root"></div>
    <script>
  (function () {
    const messages = [
      "Setting things up...",
      "Finding your perfect salon...",
      "Almost there...",
      "Polishing the details...",
    ];
    let i = 0;
    const el = document.getElementById("loader-status");
    if (el) {
      setInterval(() => {
        i = (i + 1) % messages.length;
        el.textContent = messages[i];
      }, 1800);
    }
  })();
</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
